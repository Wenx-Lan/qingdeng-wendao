<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<meta name="description" content="青灯问道 · 一盏残灯，照尽九霄。纯前端修仙文字游戏，十九重境界、四世轮回。">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="青灯问道">
<title>青灯问道 · 修仙文字游戏</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="motes" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<!-- ================= 入世 ================= -->
<section id="screen-create" class="screen create-screen">
  <div class="create-shell">
    <header class="brand-block">
      <div class="brand-seal">灯</div>
      <h1>青灯问道</h1>
      <p class="brand-sub">一盏残灯 · 照尽九霄</p>
      <p class="brand-desc">人界微末，仙路迢迢。十九重境界，四世轮回，只为一盏灯亮。</p>
    </header>

    <div class="create-body">
      <div class="create-col">
        <div class="field">
          <label for="in-name">道号</label>
          <input id="in-name" maxlength="8" value="沈青灯" autocomplete="off" spellcheck="false">
        </div>
        <div class="field">
          <label>性别</label>
          <div class="seg" id="gender-seg">
            <button type="button" data-gender="男" class="on">男</button>
            <button type="button" data-gender="女">女</button>
          </div>
        </div>
        <div class="field">
          <label>出身</label>
          <div class="origin-list" id="origin-list"></div>
        </div>
      </div>

      <div class="create-col fate-col">
        <div class="fate-card" id="fate-card"></div>
        <div class="fate-btns">
          <button type="button" class="btn ghost" id="btn-reroll">重掷灵根</button>
          <button type="button" class="btn primary big" id="btn-start">燃灯入世</button>
        </div>
        <p class="meta-line" id="meta-line"></p>
        <p class="hint-line">天赋随轮回增长。灯灭一次，灯芯便亮一分。</p>
      </div>
    </div>

    <footer class="create-foot">
      <span>人界 · 柳溪村</span>
      <span class="dot">·</span>
      <span>青灯宗</span>
      <span class="dot">·</span>
      <span>仙门</span>
      <span class="dot">·</span>
      <span>九天</span>
    </footer>
  </div>
</section>

<!-- ================= 主界面 ================= -->
<section id="screen-game" class="screen game-screen hidden">
  <header class="hud">
    <div class="hud-brand">
      <span class="seal small">灯</span>
      <span class="hud-title">青灯问道</span>
    </div>
    <div class="hud-center">
      <span class="hud-item">道历 <b id="hud-year">0</b> 年</span>
      <span class="hud-sep"></span>
      <span class="hud-item" id="hud-life">第一世</span>
    </div>
    <div class="hud-right">
      <button type="button" class="icon-btn" data-act="open-menu" title="菜单">☰</button>
    </div>
  </header>

  <main class="board">
    <aside class="col col-left" id="panel-left"></aside>
    <section class="col col-middle" id="panel-middle"></section>
    <aside class="col col-right" id="panel-right"></aside>
  </main>

  <nav class="dock" id="dock"></nav>
</section>

<!-- ================= 命运浮层 ================= -->
<div id="overlay" class="overlay hidden" aria-live="polite">
  <div class="overlay-box" id="overlay-box"></div>
</div>

<!-- ================= 模态框 ================= -->
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-veil" data-act="close-modal"></div>
  <div class="modal-box" id="modal-box">
    <button type="button" class="modal-x" data-act="close-modal" aria-label="关闭">✕</button>
    <div class="modal-content" id="modal-content"></div>
  </div>
</div>

<div id="toasts" class="toasts"></div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/narrative.js"></script>
<script src="js/story.js"></script>
<script src="js/events.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
